[project]
name = "tabpfn-db-delay-forecasting"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.1.1",
    "pandas>=2.1.2,<=2.3.3",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.64.0",
    "tabpfn>=9.1.0",
    "tabpfn-client>=0.6",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
